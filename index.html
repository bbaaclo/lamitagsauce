<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lami Tag Sauce</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lami Tag Sauce">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Jakarta";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/jakarta-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Jakarta";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/jakarta-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  color-scheme:light;
  --bg:#F4F6F5;--surface:#FFFFFF;--ink:#0E2A33;--muted:#4F6168;--line:#DCE3E2;--line2:#E6ECEB;
  --teal:#0B5C63;--teal-soft:#E3EFEE;--deep:#12414A;--deep2:#163C45;
  --gold:#E6C47A;--gold-soft:#F6EBD3;--gold-ink:#6E4C10;
  --bad:#8C2A17;--bad-soft:#F8E4DF;--good-soft:#DDF3E6;--good-ink:#14532D;
  --mist:#A9BDC2;--mist2:#C9D6D9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,p{margin:0}

#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
#stage{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
#foot .wrap{padding:10px 20px 10px;gap:0}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 4px}
.top-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.top-t p{font-size:14px;color:var(--muted);font-weight:600}
.top-t h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.top-a{display:flex;gap:8px}
.iconbtn{width:48px;height:48px;flex-shrink:0;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}

/* nav */
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:14px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current=page]{color:var(--teal);font-weight:800}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%;border-radius:20px;border:0;padding:10px 18px;font-size:18px;font-weight:800;text-align:center}
.btn.primary{background:var(--teal);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line);font-weight:700}
.btn.outline{background:transparent;border:2px solid var(--ink);font-size:16px;min-height:56px}
.btn.soft{background:var(--teal-soft);color:var(--teal);font-size:15px;min-height:46px;border-radius:14px}
.btn.danger{background:var(--bad-soft);color:var(--bad);font-size:15px;min-height:46px;border-radius:14px}
.btn.small{min-height:46px;font-size:15px;border-radius:14px}
.btn svg{width:22px;height:22px;flex-shrink:0}
.btn .two{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn .two small{font-size:13px;font-weight:600;color:#CDE6E3}

/* sell */
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;border:0;background:var(--ink);color:var(--bg);text-align:left;width:100%}
.hero .ic{width:64px;height:64px;border-radius:20px;background:var(--deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold)}
.hero .ic svg{width:36px;height:36px}
.hero .t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hero .t b{font-size:22px;font-weight:800}
.hero .t span{font-size:15px;color:var(--mist2)}
.hero .t em{font-style:normal;font-size:14px;font-weight:800;color:var(--gold)}
.hero .pill{background:var(--gold);color:var(--ink);font-weight:800;font-size:15px;padding:12px 14px;border-radius:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;border-radius:22px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.tile.in{border:2px solid var(--teal)}
.tile .tmain{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;min-height:124px;border:0;background:transparent;text-align:left;width:100%}
.tile .tmain:active,.hero:active{transform:scale(.985)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:18px;font-weight:700;display:block;word-break:break-word}
.tile span.m{font-size:14px;color:var(--muted)}
.tile.dim{background:#EEF2F1}
.tile.dim b{color:var(--muted)}
.tstep{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--teal-soft);border-top:1px solid var(--line)}
.tstep button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:700;line-height:1}
.tstep b{font-size:19px;font-weight:800;color:var(--teal)}
.tstep.zero{background:#F8FAF9}
.tstep.zero b{color:#8A989D;font-weight:700}
.tstep button:disabled{opacity:.35;cursor:not-allowed}
.inorder{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--teal-soft);color:var(--teal);font-size:15px;font-weight:700}
.inorder button{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--teal);background:#fff;color:var(--teal);font-size:14px;font-weight:800}
.lowtag{position:absolute;top:14px;right:12px;background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:700;padding:5px 9px;border-radius:10px}
.cartbar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 14px 14px 20px;border-radius:22px;border:0;background:var(--teal);color:#fff;text-align:left}
.cartbar .l{display:flex;flex-direction:column;gap:1px}
.cartbar .l small{font-size:14px;color:#CDE6E3;font-weight:600}
.cartbar .l b{font-size:22px;font-weight:800}
.cartbar .r{background:#fff;color:var(--teal);font-size:16px;font-weight:800;padding:12px 18px;border-radius:14px}

/* cards & rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.card.tight{padding:4px 14px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line .n{flex:1;min-width:0;display:flex;flex-direction:column}
.line .n b{font-size:16px;font-weight:700}
.line .n span{font-size:13px;color:var(--muted)}
.step{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.qty{min-width:56px;text-align:center;font-size:16px;font-weight:800}
h2.sec{font-size:17px;font-weight:800;margin-top:4px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg2 button{height:58px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:700}
.seg2 button svg{width:24px;height:24px}
.seg2 button[aria-pressed=true]{border:2px solid var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:800}
.paycard{background:var(--ink);color:var(--bg);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.paycard .tot{display:flex;justify-content:space-between;align-items:baseline}
.paycard .tot span{font-size:15px;color:var(--mist);font-weight:600}
.paycard .tot b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.cashin{display:flex;align-items:center;gap:10px;height:56px;border-radius:16px;background:#fff;padding:0 16px;color:var(--ink)}
.cashin span{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.cashin i{flex:1}
.cashin em{font-style:normal;font-size:20px;font-weight:700;color:var(--muted)}
.cashin input{border:0;outline:none;width:120px;font-size:22px;font-weight:800;background:transparent;text-align:right;padding:0}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{height:44px;border-radius:12px;border:1px solid #2E4F58;background:transparent;font-size:14px;font-weight:700;color:var(--bg)}
.quick button.on{border:0;background:var(--gold);color:var(--ink);font-weight:800}
.change{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:16px;padding:12px 16px;background:var(--deep2);color:var(--mist2)}
.change .l{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800}
.change .l svg{width:26px;height:26px}
.change b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.change.ok{background:var(--good-soft);color:var(--good-ink)}
.change.short{background:var(--bad-soft);color:var(--bad)}
.gcashline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gcashline span{font-size:14px;color:var(--muted);font-weight:600}
.gcashline b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--gold-soft);color:var(--gold-ink);font-size:15px;font-weight:700}
.banner svg{width:24px;height:24px;flex-shrink:0}
.banner.teal{background:var(--teal-soft);color:var(--teal)}
.sum{background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum .l{display:flex;flex-direction:column;gap:2px}
.sum .l small{font-size:13px;color:var(--mist);font-weight:600}
.sum .l b{font-size:15px;font-weight:700}
.sum>b{font-size:20px;font-weight:800;color:var(--gold);white-space:nowrap}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
.field small{font-weight:500;color:var(--muted);font-size:13px}
.field input,.field select,.search input{height:56px;width:100%;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:18px;font-weight:600}
.field input.big{height:60px;border:2px solid var(--teal);font-size:24px;font-weight:800}
.field input::placeholder,.search input::placeholder{color:#8A989D;font-weight:500}
.check{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;min-height:48px}
.check input{width:26px;height:26px;accent-color:var(--teal)}
.when{display:flex;align-items:center;gap:12px}
.when svg{width:24px;height:24px;color:var(--teal);flex-shrink:0}
.when .l{flex:1;display:flex;flex-direction:column}
.when .l small{font-size:13px;color:var(--muted);font-weight:600}
.when .l b{font-size:16px;font-weight:800}
.err{color:var(--bad);font-size:14px;font-weight:700;min-height:20px}

/* stock */
.srow{display:flex;flex-direction:column;gap:12px}
.srow .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;background:transparent;padding:0;width:100%;text-align:left}
.srow .h b{font-size:18px;font-weight:800}
.srow .h span{font-size:22px;font-weight:800;white-space:nowrap}
.srow .h span small{font-size:14px;font-weight:600;color:var(--muted)}
.srow .h span.low{color:#8A5A00}
.srow .h span.out{color:var(--bad)}
.srow .b{display:flex;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;min-width:64px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700}
.chips button.on{border:2px solid var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:800}

/* prices */
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 12px 12px 16px}
.prow .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prow .n b{font-size:17px;font-weight:800}
.prow .n span{font-size:13px;color:var(--muted)}
.pin{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:14px;padding:0 12px;height:52px;width:140px;flex-shrink:0}
.pin em{font-style:normal;font-size:18px;font-weight:700;color:var(--muted)}
.pin input{border:0;outline:none;width:100%;font-size:20px;font-weight:800;background:transparent;text-align:right;padding:0}
.phero{background:var(--ink);color:var(--bg);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.phero .h{display:flex;justify-content:space-between;align-items:center}
.phero .h b{font-size:19px;font-weight:800}
.phero .h span{font-size:14px;color:var(--mist);font-weight:600}
.phero .pin{background:#fff;width:100%;height:56px;border:2px solid var(--gold);color:var(--ink)}
.phero .pin input{font-size:24px;text-align:left}
.phero small{font-size:13px;color:var(--mist2)}

/* today */
.seg{display:flex;background:var(--line2);border-radius:14px;padding:4px}
.seg button{flex:1;height:40px;padding:0 12px;border-radius:11px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:800}
.datenav{display:flex;align-items:center;gap:8px}
.datenav b{flex:1;text-align:center;font-size:15px;font-weight:700}
.datenav .iconbtn{width:44px;height:44px;font-size:22px;font-weight:700}
.total{background:var(--ink);color:var(--bg);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
.total>span{font-size:15px;color:var(--mist);font-weight:600}
.total>b{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.total>em{font-style:normal;font-size:15px;color:var(--gold);font-weight:700}
.total .split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid #2A4952}
.total .split span{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--mist);font-weight:600}
.total .split b{font-size:19px;font-weight:800;color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:14px;color:var(--muted);font-weight:600}
.stat b{font-size:24px;font-weight:800}
.stat.bad{background:var(--bad-soft);border-color:var(--bad-soft)}
.stat.bad span,.stat.bad b{color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--teal);background:var(--teal-soft);padding:3px 8px;border-radius:8px}
.tag.gold{color:var(--gold-ink);background:var(--gold-soft)}
.tag.bad{color:var(--bad);background:var(--bad-soft)}
.sale{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.sale:last-child{border-bottom:0}
.sale .n{min-width:0;display:flex;flex-direction:column;gap:3px}
.sale .n b{font-size:15px;font-weight:700}
.sale .n span{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sale .a{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.sale .a b{font-size:17px;font-weight:800}
.sale .a button{border:1px solid var(--line);background:var(--surface);color:var(--bad);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}
.sale.void .n b,.sale.void .a b{text-decoration:line-through;opacity:.5}
.hint{font-size:13px;color:var(--muted);text-align:center}

/* bus */
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.search svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.search input{border:0;height:auto;padding:0;font-size:16px;font-weight:500;background:transparent;outline:none}
h2.day{font-size:15px;font-weight:800;color:var(--muted);margin-top:6px}
.bus{display:flex;flex-direction:column;gap:10px}
.bus .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bus .h .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bus .no{background:var(--ink);color:var(--gold);font-size:17px;font-weight:800;padding:7px 12px;border-radius:12px}
.bus .tm{font-size:15px;color:var(--muted);font-weight:700}
.bus .am{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bus .am b{font-size:18px;font-weight:800}
.bus .to{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:15px;font-weight:700}
.bus .to svg{width:18px;height:18px;color:var(--teal);flex-shrink:0}
.bus .who b{font-size:16px;font-weight:700;display:block}
.bus .who span{font-size:14px;color:var(--muted)}
.bus.void{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}

/* sheet */
#sheetBg{position:fixed;inset:0;background:rgba(14,42,51,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--surface);border-radius:32px 32px 0 0;width:100%;max-width:520px;max-height:94dvh;overflow:auto;padding:12px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
#sheet .grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);flex-shrink:0}
#sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#sheet .sh h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
#sheet .sh p{font-size:15px;color:var(--muted);margin-top:3px}
#sheet .x{width:44px;height:44px;border-radius:22px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sheet .x svg{width:20px;height:20px}
.wdisp{background:var(--ink);color:var(--bg);border-radius:24px;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-end}
.wdisp div{display:flex;flex-direction:column;gap:2px}
.wdisp div:last-child{align-items:flex-end}
.wdisp small{font-size:14px;color:var(--mist);font-weight:600}
.wdisp .w{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1}
.wdisp .w i{font-style:normal;font-size:24px;font-weight:700;color:var(--gold)}
.wdisp .a{font-size:26px;font-weight:800}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{height:54px;border-radius:16px;border:0;background:var(--bg);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.keys button svg{width:26px;height:26px}

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const r3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
const num = v => { const s = String(v == null ? '' : v).replace(/,/g, '').trim(); if (s === '') return NaN; const n = Number(s); return Number.isFinite(n) ? n : NaN; };
const pad = n => String(n).padStart(2, '0');
const money = n => '₱' + r2(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const peso = n => Number.isInteger(r2(n)) ? '₱' + r2(n).toLocaleString('en-PH') : money(n);
const qtyStr = (q, unit) => unit === 'kg' ? r3(q) + ' kg' : q + (q === 1 ? ' pc' : ' pcs');
const dayStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const timeStr = ts => new Date(ts).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
const dateLong = d => d.toLocaleDateString('en-PH', { weekday: 'long', month: 'short', day: 'numeric' });
const dateShort = d => d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
const localInput = d => dayStr(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());

const svg = (p, sw) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const IC = {
  oyster: svg('<path d="M3.5 12.5h17a8.5 7.5 0 0 1-17 0z"/><path d="M4.5 9.5a8.2 6.5 0 0 1 15 0"/><circle cx="12" cy="10.2" r="2.1" fill="currentColor" stroke="none"/><path d="M8.5 15.5l.6 2.6"/><path d="M12 15.5v3.6"/><path d="M15.5 15.5l-.6 2.6"/>', 1.6),
  bag: svg('<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>'),
  bus: svg('<rect x="4" y="3.5" width="16" height="13" rx="2.5"/><path d="M4 10h16"/><path d="M7 16.5V19"/><path d="M17 16.5V19"/><circle cx="8" cy="13.3" r=".8"/><circle cx="16" cy="13.3" r=".8"/>'),
  box: svg('<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'),

  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>', 1.6),
  back: svg('<path d="M15 5l-7 7 7 7"/>', 2),
  next: svg('<path d="M9 5l7 7-7 7"/>', 2.2),
  pin: svg('<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>', 1.9),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  cash: svg('<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5"/><path d="M18 9.5v5"/>'),
  phone: svg('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18h2"/>'),
  egg: svg('<path d="M12 3c-3.5 0-6.5 5.5-6.5 10a6.5 6.5 0 0 0 13 0C18.5 8.5 15.5 3 12 3z"/>', 1.7),
  bottle: svg('<path d="M10 2.5h4v3.5l2 3V20a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 8 20V9l2-3z"/><path d="M8 13h8"/>', 1.7),
  parcel: svg('<path d="M3.5 9.5L12 4l8.5 5.5L12 20z"/><path d="M3.5 9.5h17"/>', 1.7),
  warn: svg('<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/>', 2),
  save: svg('<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>', 2),
  plus: svg('<path d="M12 5v14"/><path d="M5 12h14"/>', 2.4),
  x: svg('<path d="M6 6l12 12"/><path d="M18 6L6 18"/>', 2),
  undo: svg('<path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-2"/>', 2),
  del: svg('<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6"/><path d="M12 9l5 6"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', 2)
};
const iconFor = it => /balot|penoy|egg|itlog/i.test(it.name) ? IC.egg : /pater|rice|kan-on/i.test(it.name) ? IC.parcel : (it.unit === 'pc' && !it.perishable) ? IC.bottle : IC.parcel;

/* ================= state ================= */
let db, items = [], sales = [], spoils = [];
let settings = { name: 'Lami Tag Sauce', pin: null, rec: null, lastBackup: 0, lockUntil: 0 };
const cart = new Map();
let view = 'sell';
let dayPay = { pay: 'cash', cash: '' };
let busDraft = null;
let weigh = '';
let report = { date: dayStr(new Date()), range: 'day' };
let dayKey = dayStr(new Date());
function rollDay() { const t = dayStr(new Date()); if (t !== dayKey) { dayKey = t; report.date = t; report.range = 'day'; } }
let busQuery = '';
let sheetState = null;

const item = id => items.find(i => i.id === id);
const sorted = () => items.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
const isOut = i => i.stock <= 0;
const isLow = i => i.stock > 0 && i.stock <= (i.low || 0);

/* ================= database ================= */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lami-tag-sauce', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      ['items', 'sales', 'spoils'].forEach(s => d.createObjectStore(s, { keyPath: 'id' }));
      d.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = s => reqP(db.transaction(s).objectStore(s).getAll());
function tx(stores, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(stores, 'readwrite'); const o = {};
    stores.forEach(s => { o[s] = t.objectStore(s); });
    fn(o);
    t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error);
  });
}
const saveSettings = () => tx(['kv'], o => o.kv.put({ k: 'settings', v: settings }));
const SEED = [
  { id: 'talaba', name: 'Talaba', unit: 'kg', perishable: true, low: 3 },
  { id: 'pater', name: 'Pater', unit: 'pc', perishable: true, low: 5 },
  { id: 'balot', name: 'Balot', unit: 'pc', perishable: true, low: 5 },
  { id: 'penoy', name: 'Penoy', unit: 'pc', perishable: true, low: 5 },
  { id: 'softdrink', name: 'Soft drink', unit: 'pc', perishable: false, low: 5 },
  { id: 'water', name: 'Mineral water', unit: 'pc', perishable: false, low: 5 }
].map((x, i) => ({ ...x, price: null, stock: 0, hist: [], order: i }));

/* ================= toast & sheet ================= */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function openSheet(html, state) { sheetState = state || null; $('#sheet').innerHTML = '<span class="grab"></span>' + html; $('#sheetBg').hidden = false; $('#sheet').scrollTop = 0; }
function closeSheet() { $('#sheetBg').hidden = true; $('#sheet').innerHTML = ''; sheetState = null; }
const sheetHead = (title, sub) => '<div class="sh"><div><h2>' + esc(title) + '</h2>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div><button type="button" class="x" data-act="close" aria-label="Close">' + IC.x + '</button></div>';
function confirmSheet(title, text, okLabel, fn, danger) {
  openSheet(sheetHead(title, text) + '<div class="row2e"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn ' + (danger ? 'danger' : 'primary') + '" style="min-height:60px;border-radius:20px;font-size:17px" data-act="confirmOk">' + esc(okLabel) + '</button></div>', { confirm: fn });
}

/* ================= PIN lock ================= */
function cyrb(str) { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0'); }
const canSha = () => typeof crypto !== 'undefined' && crypto.subtle && typeof TextEncoder !== 'undefined';
async function hashWith(algo, text) {
  if (algo === 's') { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = text; for (let i = 0; i < 200; i++) h = cyrb(h + text); return h;
}
function rnd(n, chars) { const a = new Uint32Array(n); if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 4294967296); return [...a].map(x => chars[x % chars.length]).join(''); }
async function makeSecret(value) { const algo = canSha() ? 's' : 'c'; const salt = rnd(12, 'abcdefghijklmnopqrstuvwxyz0123456789'); return { algo, salt, hash: await hashWith(algo, salt + ':' + value) }; }
async function checkSecret(sec, value) { if (!sec) return false; if (sec.algo === 's' && !canSha()) return false; return (await hashWith(sec.algo, sec.salt + ':' + value)) === sec.hash; }
const normCode = c => String(c).toUpperCase().replace(/[^A-Z0-9]/g, '');

let lock = { mode: 'enter', buf: '', first: '', err: '', code: '', cancel: false, viaRec: false };
let locked = true, fails = 0, lockTick = null, idleT = null, hiddenAt = 0;
const IDLE_MS = 5 * 60 * 1000, HIDE_MS = 60 * 1000;
function showLock(mode, opts) { lock = Object.assign({ mode, buf: '', first: '', err: '', code: '', cancel: false, viaRec: false }, opts || {}); locked = true; closeSheet(); $('#lock').hidden = false; renderLock(); }
function unlock() { locked = false; $('#lock').hidden = true; touch(); render(); }
function touch() { clearTimeout(idleT); if (!locked) idleT = setTimeout(() => { if (!locked && settings.pin) showLock('enter'); }, IDLE_MS); }
function renderLock() {
  const m = lock.mode, el = $('#lock');
  const wait = Math.max(0, Math.ceil((settings.lockUntil - Date.now()) / 1000));
  const msgs = { setup1: 'Create a 4-digit PIN to protect your records', setup2: 'Enter the same PIN again', enter: 'Welcome back. Enter your 4-digit PIN', new1: 'Choose a new 4-digit PIN', new2: 'Enter the new PIN again', recover: 'Enter your recovery code', showcode: 'Your recovery code' };
  let h = '<div class="logo">' + IC.oyster + '</div><p class="k">Talabahan</p><h1>' + esc(settings.name) + '</h1><p class="msg">' + msgs[m] + '</p>';
  if (m === 'showcode') {
    h += '<div class="box"><div class="code">' + esc(lock.code) + '</div><p class="msg" style="margin:0">Write this code on paper and keep it somewhere safe. It is the only way to reset a forgotten PIN.</p><button type="button" class="btn gold" data-act="ack">I wrote it down</button></div>';
  } else if (m === 'recover') {
    h += '<p class="lerr">' + esc(lock.err) + '</p><div class="box"><input id="recIn" type="text" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" aria-label="Recovery code"><button type="button" class="btn gold" data-act="reccheck">Continue</button></div><div class="grow"></div><button type="button" class="link" data-act="backpin">Back to PIN</button>';
  } else {
    const err = (m === 'enter' && wait > 0) ? 'Too many wrong tries. Wait ' + wait + ' seconds.' : lock.err;
    h += '<p class="lerr">' + esc(err) + '</p><div class="dots" aria-label="' + lock.buf.length + ' of 4 digits entered">' + [0, 1, 2, 3].map(i => '<span' + (i < lock.buf.length ? ' class="on"' : '') + '></span>').join('') + '</div><div class="pad">' +
      ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => '<button type="button" data-act="pin" data-k="' + k + '">' + k + '</button>').join('') +
      '<span></span><button type="button" data-act="pin" data-k="0">0</button><button type="button" class="del" data-act="pin" data-k="del" aria-label="Delete last digit">' + IC.del + '</button></div><div class="grow"></div>';
    if (m === 'enter') h += '<button type="button" class="link" data-act="forgot">Forgot PIN? Use recovery code</button>';
    else if (lock.cancel) h += '<button type="button" class="link" data-act="pincancel">Cancel</button>';
  }
  el.innerHTML = h;
  clearInterval(lockTick);
  if (m === 'enter' && wait > 0) lockTick = setInterval(() => { if (lock.mode !== 'enter' || Date.now() >= settings.lockUntil) { clearInterval(lockTick); } renderLock(); }, 1000);
}
async function submitPin() {
  const m = lock.mode, buf = lock.buf;
  if (m === 'setup1' || m === 'new1') { lock.first = buf; lock.buf = ''; lock.err = ''; lock.mode = m === 'setup1' ? 'setup2' : 'new2'; return renderLock(); }
  if (m === 'setup2' || m === 'new2') {
    if (buf !== lock.first) { lock.buf = ''; lock.first = ''; lock.err = 'The PINs did not match. Try again.'; lock.mode = m === 'setup2' ? 'setup1' : 'new1'; return renderLock(); }
    settings.pin = await makeSecret(buf); fails = 0; settings.lockUntil = 0;
    if (m === 'setup2' || lock.viaRec) { return newRecovery(); }
    await saveSettings(); unlock(); toast('PIN changed'); return;
  }
  if (m === 'enter') {
    if (Date.now() < settings.lockUntil) { lock.buf = ''; return renderLock(); }
    if (await checkSecret(settings.pin, buf)) { fails = 0; return unlock(); }
    fails++; lock.buf = ''; lock.err = 'Wrong PIN. Try again.';
    if (fails >= 5) { fails = 0; settings.lockUntil = Date.now() + 30000; lock.err = ''; await saveSettings(); }
    renderLock();
  }
}
async function newRecovery() {
  const raw = rnd(8, 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
  settings.rec = await makeSecret(raw); await saveSettings();
  lock.mode = 'showcode'; lock.code = raw.slice(0, 4) + '-' + raw.slice(4); lock.buf = ''; lock.err = '';
  locked = true; $('#lock').hidden = false; renderLock();
}

/* ================= cart ================= */
const cartLines = () => { const out = []; cart.forEach((q, id) => { const it = item(id); if (it && it.price != null) out.push({ itemId: id, name: it.name, unit: it.unit, price: it.price, qty: q }); }); return out; };
const linesTotal = ls => r2(ls.reduce((a, l) => a + l.price * l.qty, 0));
const cartCount = () => { let n = 0; cart.forEach((q, id) => { const it = item(id); n += it && it.unit === 'kg' ? 1 : q; }); return n; };

/* ================= views ================= */
const head = (sub, title, back) => '<div class="top">' + (back ? '<button type="button" class="iconbtn" data-act="go" data-v="' + back + '" aria-label="Back">' + IC.back + '</button>' : '') +

function addPiece(id) {
  const it = item(id); if (!it) return;
  if (it.price == null) return toast('Set a price for ' + it.name + ' in Prices first');
  if (isOut(it)) return openQty('add', id, 'No ' + it.name + ' in stock yet. Add stock first.');
  const cur = cart.get(id) || 0, stepq = it.unit === 'kg' ? 0.5 : 1;
  if (cur + stepq > it.stock + 1e-9) return toast('Only ' + qtyStr(it.stock, it.unit) + ' left');
  cart.set(id, r3(cur + stepq)); render(true);
}
function decPiece(id) {
  const it = item(id); const cur = cart.get(id) || 0, stepq = it && it.unit === 'kg' ? 0.5 : 1;
  if (cur - stepq <= 1e-9) cart.delete(id); else cart.set(id, r3(cur - stepq));
  if (!cart.size && view === 'review') return go('sell');
  render(true);
}

/* ---- Payment block (shared) ---- */
function bills(total) {
  const out = [];
  [50, 100, 500, 1000].forEach(s => { const b = Math.ceil(total / s) * s; if (b > total && !out.includes(b)) out.push(b); });
  return out.slice(0, 3);
}
function payBlock(ctx, total, st) {
  let h = '<h2 class="sec">How did they pay?</h2><div class="seg2" role="group" aria-label="Payment method">' +
    '<button type="button" data-act="pay" data-ctx="' + ctx + '" data-v="cash" aria-pressed="' + (st.pay === 'cash') + '">' + IC.cash + 'Cash</button>' +
    '<button type="button" data-act="pay" data-ctx="' + ctx + '" data-v="gcash" aria-pressed="' + (st.pay === 'gcash') + '">' + IC.phone + 'GCash</button></div>';
  if (st.pay === 'cash') {
    h += '<div class="paycard"><div class="tot"><span>Total to pay</span><b>' + money(total) + '</b></div>' +
      '<label class="cashin"><span>Cash received</span><i></i><em>₱</em><input id="cashIn" data-ctx="' + ctx + '" data-total="' + total + '" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" value="' + esc(st.cash) + '"></label>' +
      '<div class="quick" role="group" aria-label="Quick cash amounts"><button type="button" data-act="cashq" data-v="' + total + '">Exact</button>' + bills(total).map(b => '<button type="button" data-act="cashq" data-v="' + b + '">' + peso(b) + '</button>').join('') + '</div>' +
      '<div class="change" id="changeBox"></div></div>';
  } else {
    h += '<div class="card gcashline"><span>Paid by GCash, no change needed</span><b>' + money(total) + '</b></div>';
  }
  return h;
}
function updateChange() {
  const inp = $('#cashIn'), box = $('#changeBox'); if (!inp || !box) return;
  const total = Number(inp.dataset.total), c = num(inp.value);
  $$('.quick button').forEach(b => b.classList.toggle('on', !isNaN(c) && Number(b.dataset.v) === c));
  if (isNaN(c)) { box.className = 'change'; box.innerHTML = '<span class="l">' + IC.undo + 'Change</span><span style="font-size:14px;font-weight:600">Enter cash received</span>'; return; }
  const d = r2(c - total);
  if (d >= 0) { box.className = 'change ok'; box.innerHTML = '<span class="l">' + IC.undo + 'Give change</span><b>' + money(d) + '</b>'; }
  else { box.className = 'change short'; box.innerHTML = '<span class="l">' + IC.warn + 'Short</span><b>' + money(-d) + '</b>'; }
}
const lineRow = (l, dec, inc) => '<div class="line"><span class="n"><b>' + esc(l.name) + '</b><span>' + money(l.price * l.qty) + '</span></span>' +

/* ---- Today ---- */
function bounds() {
  const d = parseDay(report.date); let s, e;
  if (report.range === 'day') { s = new Date(d); e = new Date(d); e.setDate(e.getDate() + 1); }
  else if (report.range === 'week') { e = new Date(d); e.setDate(e.getDate() + 1); s = new Date(e); s.setDate(s.getDate() - 7); }
  else { s = new Date(d.getFullYear(), d.getMonth(), 1); e = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  return [s.getTime(), e.getTime()];
}
VIEWS.today = () => {
  const [s, e] = bounds(), isToday = report.range === 'day' && report.date === dayStr(new Date());
  const label = report.range === 'day' ? dateLong(new Date(s)) : report.range === 'month' ? new Date(s).toLocaleDateString('en-PH', { month: 'long', year: 'numeric' }) : dateShort(new Date(s)) + ' to ' + dateShort(new Date(e - 1));
  const inR = sales.filter(x => x.ts >= s && x.ts < e).sort((a, b) => b.ts - a.ts), live = inR.filter(x => !x.voided);
  const total = live.reduce((a, x) => a + x.total, 0), cash = live.filter(x => x.pay === 'cash').reduce((a, x) => a + x.total, 0);
  const by = new Map(); let talabaKg = 0;
  live.forEach(x => x.lines.forEach(l => { const k = l.name + '|' + l.unit; const r = by.get(k) || { name: l.name, unit: l.unit, qty: 0, amt: 0 }; r.qty += l.qty; r.amt += l.price * l.qty; by.set(k, r); if (l.itemId === 'talaba') talabaKg += l.qty; }));
  const sp = spoils.filter(x => x.ts >= s && x.ts < e), spVal = sp.reduce((a, x) => a + (x.value || 0), 0);
  const rows = [...by.values()].sort((a, b) => b.amt - a.amt);
  let body = head(label, isToday ? 'Today' : 'Report') +

  return { body, foot };
};

/* ================= saving sales ================= */
async function saveSale(lines, pay, cashStr, bus) {
  const changed = [];
  for (const l of lines) {
    const it = item(l.itemId);
    if (!it || l.qty > it.stock + 1e-9) { toast('Not enough ' + l.name + ' in stock'); return null; }
    changed.push({ ...it, stock: r3(it.stock - l.qty) });
  }
  const total = linesTotal(lines); let cashReceived = null;
  if (pay === 'cash' && String(cashStr || '').trim() !== '') {
    const c = num(cashStr);
    if (isNaN(c)) { toast('Check the cash received amount'); return null; }
    if (c < total) { toast('Cash is short by ' + money(total - c)); return null; }
    cashReceived = r2(c);
  }
  const sale = { id: uid(), ts: Date.now(), lines, total, pay, cashReceived, bus: bus || null, voided: false };
  try { await tx(['items', 'sales'], o => { changed.forEach(i => o.items.put(i)); o.sales.put(sale); }); }
  catch (e) { toast('Could not save. Please try again.'); return null; }
  changed.forEach(c => { items[items.findIndex(i => i.id === c.id)] = c; });
  sales.push(sale);
  return sale;
}
async function voidSale(id) {
  const s = sales.find(x => x.id === id); if (!s || s.voided) return;
  const upd = { ...s, voided: true, voidedAt: Date.now() }, changed = new Map();
  s.lines.forEach(l => { const it = changed.get(l.itemId) || item(l.itemId); if (it) changed.set(l.itemId, { ...it, stock: r3(it.stock + l.qty) }); });
  try { await tx(['items', 'sales'], o => { changed.forEach(i => o.items.put(i)); o.sales.put(upd); }); }
  catch (e) { return toast('Could not void the sale.'); }
  changed.forEach(c => { items[items.findIndex(i => i.id === c.id)] = c; });
  sales[sales.findIndex(x => x.id === id)] = upd;
  toast('Sale voided. Items are back in stock.'); render(true);
}

/* ================= backup ================= */
async function backup() {
  const data = { app: 'lami-tag-sauce', version: 1, exportedAt: new Date().toISOString(), storeName: settings.name, items, sales, spoils };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a'), n = new Date();
  a.href = url; a.download = 'lami-tag-sauce-backup-' + dayStr(n) + '-' + pad(n.getHours()) + pad(n.getMinutes()) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  settings.lastBackup = Date.now(); await saveSettings();
  toast('Backup file saved to Downloads'); if (view === 'today') render(true);
}
async function restore(file) {
  let d;
  try { d = JSON.parse(await file.text()); if (!d || d.app !== 'lami-tag-sauce' || !Array.isArray(d.items) || !Array.isArray(d.sales)) throw new Error('bad'); }
  catch (e) { return toast('That file is not a Lami Tag Sauce backup'); }
  confirmSheet('Restore this backup?', 'This replaces everything on this device with the backup: ' + d.items.length + ' items and ' + d.sales.length + ' orders. Your PIN stays the same.', 'Restore', async () => {
    try {
      await tx(['items', 'sales', 'spoils'], o => { o.items.clear(); o.sales.clear(); o.spoils.clear(); d.items.forEach(i => o.items.put(i)); d.sales.forEach(x => o.sales.put(x)); (d.spoils || []).forEach(x => o.spoils.put(x)); });
    } catch (e) { return toast('Could not restore the backup.'); }
    items = d.items; sales = d.sales; spoils = d.spoils || []; cart.clear(); busDraft = null;
    if (d.storeName) { settings.name = d.storeName; await saveSettings(); }
    closeSheet(); toast('Backup restored'); go('sell');
  }, true);
}

function collectReport() {
  const [s, e] = bounds(), rg = report.range;
  const inR = sales.filter(x => x.ts >= s && x.ts < e).sort((a, b) => b.ts - a.ts);
  const live = inR.filter(x => !x.voided);
  const d = { rg, s, e, now: Date.now(), voided: inR.length - live.length, orders: live, total: 0, cash: 0, gcash: 0, nCash: 0, nG: 0, talKg: 0, talAmt: 0, by: new Map(), days: new Map() };
  live.forEach(x => {
    d.total += x.total;
    if (x.pay === 'cash') { d.cash += x.total; d.nCash++; } else { d.gcash += x.total; d.nG++; }
    const dk = dayStr(new Date(x.ts)), dr = d.days.get(dk) || { n: 0, cash: 0, gcash: 0 };
    dr.n++; dr[x.pay === 'cash' ? 'cash' : 'gcash'] += x.total; d.days.set(dk, dr);
    x.lines.forEach(l => {
      const k = l.name + '|' + l.unit, r = d.by.get(k) || { name: l.name, unit: l.unit, qty: 0, amt: 0, prices: new Set() };
      r.qty += l.qty; r.amt += l.price * l.qty; r.prices.add(l.price); d.by.set(k, r);
      if (l.itemId === 'talaba') { d.talKg += l.qty; d.talAmt += l.price * l.qty; }
    });
  });
  d.bus = live.filter(x => x.bus).sort((a, b) => b.bus.droppedAt - a.bus.droppedAt);
  d.sp = spoils.filter(x => x.ts >= s && x.ts < e);
  return d;
}

async function embeddedFontCss() {
  if (fontCssCache) return fontCssCache;
  const b64 = async u => { const r = await fetch(u); if (!r.ok) throw new Error('font'); const b = new Uint8Array(await r.arrayBuffer()); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const [a, x] = await Promise.all([b64('fonts/jakarta-latin.woff2'), b64('fonts/jakarta-latin-ext.woff2')]);
  fontCssCache = '@font-face{font-family:"Jakarta";font-style:normal;font-weight:200 800;src:url(data:font/woff2;base64,' + a + ') format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}' +
    '@font-face{font-family:"Jakarta";font-style:normal;font-weight:200 800;src:url(data:font/woff2;base64,' + x + ') format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}';
  return fontCssCache;
}
async function makeReportJpeg(d) {
  let fcss = ''; try { fcss = await embeddedFontCss(); } catch (e) { fcss = ''; }
  try { await Promise.all(['600', '700', '800'].map(w => document.fonts.load(w + ' 20px Jakarta', '₱Aa'))); await document.fonts.ready; } catch (e) {}
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-20000px;top:0;width:1080px;pointer-events:none';
  holder.innerHTML = '<style>.rp,.rp *{box-sizing:content-box}</style>' + reportHTML(d);
  document.body.appendChild(holder);
  try {
    const root = holder.querySelector('.rp'), H = Math.ceil(root.getBoundingClientRect().height) + 2;
    if (H > 15000) throw new Error('too tall');
    const xs = new XMLSerializer();
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="' + H + '"><foreignObject x="0" y="0" width="1080" height="' + H + '"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1080px;height:' + H + 'px"><style>' + fcss + '</style>' + xs.serializeToString(holder.querySelector('style')) + xs.serializeToString(root) + '</div></foreignObject></svg>';
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('render')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const cv = document.createElement('canvas'); cv.width = 1080; cv.height = H;
    const cx = cv.getContext('2d'); cx.fillStyle = RC.bg; cx.fillRect(0, 0, 1080, H); cx.drawImage(img, 0, 0);
    const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('jpeg')), 'image/jpeg', 0.92));
    return blob;
  } finally { holder.remove(); }
}

  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ================= actions ================= */

  add: d => addPiece(d.id),
  dec: d => decPiece(d.id),
  weigh: () => openWeigh(),
  rmtalaba: () => { cart.delete('talaba'); render(true); },
  wchip: d => { weigh = d.v; drawWeigh(); },
  wkey: d => {
    if (d.k === 'del') weigh = weigh.slice(0, -1);
    else if (d.k === '.') { if (!weigh.includes('.')) weigh = (weigh === '' ? '0' : weigh) + '.'; }
    else { const dec = weigh.split('.')[1]; if ((dec && dec.length >= 2) || weigh.replace('.', '').length >= 5) return; weigh = weigh === '0' ? d.k : weigh + d.k; }
    drawWeigh();

  wadd: () => {
    const t = item('talaba'), kg = r3(num(weigh) || 0), cur = cart.get('talaba') || 0;

  },
  wbus: () => {
    const t = item('talaba'), kg = r3(num(weigh) || 0);

  bdec: () => { if (busDraft.kg - 0.5 <= 1e-9) return toast('Tap the back arrow to cancel this bus order'); busDraft.kg = r3(busDraft.kg - 0.5); render(true); },
  pay: d => { const st = d.ctx === 'bus' ? busDraft : dayPay; st.pay = d.v; render(true); },
  cashq: d => { const i = $('#cashIn'); i.value = r2(Number(d.v)).toFixed(2); (i.dataset.ctx === 'bus' ? busDraft : dayPay).cash = i.value; updateChange(); },
  complete: async () => {

    cart.clear(); dayPay = { pay: 'cash', cash: '' };
    go('sell'); toast('Sale saved · ' + money(sale.total) + ' · ' + (sale.pay === 'cash' ? 'Cash' : 'GCash'));
  },
  busnext: () => {
    const total = linesTotal([busLine()]);

  qty: d => openQty(d.mode, d.id),
  qchip: d => { const i = $('#qtyIn'); i.value = r3((num(i.value) || 0) + Number(d.v)); },
  qtysave: async () => {

    db = await openDB();
    const kv = await reqP(db.transaction('kv').objectStore('kv').get('settings'));
    if (kv) settings = Object.assign(settings, kv.v);
    [items, sales, spoils] = await Promise.all([getAll('items'), getAll('sales'), getAll('spoils')]);
    if (!kv && !items.length) { await tx(['items'], o => SEED.forEach(i => o.items.put(i))); items = SEED.map(i => ({ ...i })); await saveSettings(); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    $('#lock').innerHTML = '<h1>Lami Tag Sauce</h1><p class="msg">This browser cannot store records. Open the app in Chrome, not in private or incognito mode.</p>';
    return;
  }
  document.title = settings.name;
  render();
  showLock(settings.pin ? 'enter' : 'setup1');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
